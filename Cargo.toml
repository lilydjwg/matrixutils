[package]
name = "matrixutils"
version = "0.2.2"
edition = "2024"

[dependencies]
matrix-sdk = { version = "*", features = ["eyre"] }

# password login
rustyline = { version = "*", default-features = false }
pinentry = "*"
secrecy = "0.10" # be consistent with pinentry

tokio = { version = "*", features = ["signal"] }
futures = "*"
futures-util = "*"

url = { version = "*", features = ["serde"] }
serde_json = "*"
serde = "*"

tracing = "*"
eyre = "*"
